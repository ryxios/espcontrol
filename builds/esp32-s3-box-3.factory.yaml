# =============================================================================
# FACTORY BUILD - Espressif ESP32-S3-BOX-3
# =============================================================================
# Factory image: www.js bundled inline for first-boot web UI access.
# =============================================================================

substitutions:
  name: "espcontrol-s3-box-3"
  friendly_name: "Espressif ESP32-S3-BOX-3"
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include ../devices/esp32-s3-box-3/packages.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: jtenniswood.espcontrol
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://jtenniswood/espcontrol/devices/esp32-s3-box-3/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "../docs/public/webserver/esp32-s3-box-3/www.js"

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
