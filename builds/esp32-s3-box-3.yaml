# =============================================================================
# BUILD PROFILE - Espressif ESP32-S3-BOX-3
# =============================================================================
# CI/local build entry point for the 2.4" 320×240 ESP32-S3-BOX-3 panel.
# =============================================================================

substitutions:
  name: "espcontrol-s3-box-3"
  friendly_name: "Espressif ESP32-S3-BOX-3"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/esp32-s3-box-3/packages.yaml

wifi:
  # Compile-only station credentials for CI/local builds. User-imported
  # deployed configs supply their real WiFi credentials in device YAML.
  ssid: "ESPControl"
  password: "espcontrol"
  ap:
    ssid: "${friendly_name}"

captive_portal:
