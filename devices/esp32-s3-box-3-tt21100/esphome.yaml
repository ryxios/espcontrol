# =============================================================================
# ESPHOME ENTRY POINT - Espressif ESP32-S3-BOX-3 (TT21100 touch)
# =============================================================================
# User-facing config file. Set your device name and WiFi credentials here.
# Use this variant only for ESP32-S3-BOX-3 boards with a TT21100 touch
# controller. GT911 boards should use devices/esp32-s3-box-3/esphome.yaml.
# =============================================================================

# ---------------------------------------------------------------------------
# Device identity
# ---------------------------------------------------------------------------
substitutions:
  name: "your-device-name"
  friendly_name: "Your Device Name"

# ---------------------------------------------------------------------------
# WiFi credentials (stored in secrets.yaml)
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# Remote package (pulls full config from GitHub)
# ---------------------------------------------------------------------------
packages:
  setup:
    url: https://github.com/ryxios/espcontrol/
    file: devices/esp32-s3-box-3-tt21100/packages.yaml
    refresh: 1s
