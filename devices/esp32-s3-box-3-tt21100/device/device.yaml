# =============================================================================
# DEVICE - Espressif ESP32-S3-BOX-3 hardware definition
# =============================================================================
# Pin assignments come from Espressif esp-bsp bsp/esp-box-3 at commit
# 8d403e718188a25811e869fdafe613b36dd09007. Do not substitute pins from
# ESP32-S3-DevKitC or other S3 boards.
#
# Integrated but intentionally not enabled here:
#   - Audio speaker/microphone (ES8311 + ES7210 over I2S) because EspControl has
#     no board-audio abstraction today.
#   - SD card, IMU, and PMOD expansion because EspControl does not consume them.
#   - Dynamic touch-controller probing because ESPHome YAML must choose one static
#     touch platform. This slug selects TT21100; the base esp32-s3-box-3 slug
#     remains the GT911 profile.
# =============================================================================

substitutions:
  espcontrol_component_url: "https://github.com/ryxios/espcontrol"
  espcontrol_component_ref: "main"

# ---------------------------------------------------------------------------
# ESP32-S3 platform (16MB QSPI flash, 16MB octal PSRAM per Espressif BSP)
# ---------------------------------------------------------------------------
esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.2
    source: https://github.com/pioarduino/esp-idf/releases/download/v5.5.2/esp-idf-v5.5.2.tar.xz
    platform_version: 55.03.37
    sdkconfig_options:
      # Espressif BSP uses native USB-C for serial/JTAG/programming.
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_UART: "n"
      # The S3 display stack leaves little internal RAM for HTTPS OTA checks.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "8"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

# ---------------------------------------------------------------------------
# External component
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: ${espcontrol_component_url}
      ref: ${espcontrol_component_ref}
      path: components
    components: [espcontrol, web_server_idf, artwork_image]
    refresh: 1s

espcontrol:

# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_size: 16MB
    build_flags:
      - "-DESPCONTROL_DISABLE_TODO=1"
      - "-DESPCONTROL_MAX_GRID_SLOTS=4"
      - "-DBOARD_ESP32_S3_BOX_3=1"
      - "-DESP32_S3_BOX_3=1"
      # Harmless under ESP-IDF, but kept explicit for PlatformIO/USB parity.
      - "-DARDUINO_USB_MODE=1"
      - "-DARDUINO_USB_CDC_ON_BOOT=1"
      - "-DBOARD_HAS_PSRAM=1"
  on_boot:
    - priority: -100
      then:
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation

# ---------------------------------------------------------------------------
# PSRAM (video/LVGL buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  boot_is_good_after: 10s

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

api:
  listen_backlog: 4
  max_connections: 3
  max_send_queue: 12

# Native USB-C on ESP32-S3-BOX-3 is USB Serial/JTAG, not a UART0 bridge.
logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  use_psram: true

# ---------------------------------------------------------------------------
# Backlight (BSP_LCD_BACKLIGHT GPIO47, active-high LEDC PWM at 5 kHz)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO47
    id: gpio_backlight_pwm
    frequency: 5000Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                return id(screen_schedule_asleep) ||
                       (id(schedule_enabled).state && !panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now()).is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: 'return id(screensaver_display_off_active);'
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - if:
            condition:
              lambda: |-
                return !id(display_asleep) &&
                       !id(screen_schedule_asleep) &&
                       !id(screensaver_display_off_active) &&
                       !id(screensaver_dimmed_active);
            then:
              - script.execute: screen_schedule_manual_sleep

# ---------------------------------------------------------------------------
# Physical buttons from BSP: boot/config GPIO0 and mute GPIO1.
# The red circular home touch button is exposed by the selected touch controller
# (${touchscreen_platform}; TT21100 for this variant).
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: Config Button
    id: config_button
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - script.execute: screensaver_wake

  - platform: gpio
    name: Mute Button
    id: mute_button
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - script.execute: screensaver_wake

  - platform: ${touchscreen_platform}
    name: Home Touch Button
    id: home_touch_button
    index: 0
    on_press:
      then:
        - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# SPI bus and display (BSP_LCD_PCLK GPIO7, BSP_LCD_DATA0 GPIO6)
# ---------------------------------------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO7
    mosi_pin: GPIO6

# ---------------------------------------------------------------------------
# I2C bus and touchscreen (BSP_I2C_SDA GPIO8, BSP_I2C_SCL GPIO18,
# BSP_LCD_TOUCH_INT GPIO3). GT911 and TT21100 variants use the same BSP pins.
# Their reset line is shared with LCD reset in the BSP, so ESPHome leaves
# reset_pin unset to avoid double-driving GPIO48.
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO8
  scl: GPIO18
  frequency: 400kHz

touchscreen:
  - platform: ${touchscreen_platform}
    id: my_touchscreen
    display: my_display
    interrupt_pin: GPIO3
    update_interval: 16ms
    transform:
      mirror_x: false
      mirror_y: false
    on_touch:
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (2.4" 320x240 SPI LCD; ESPHome S3BOX model covers the S3-BOX init
# sequence, while pins/frequency/mirroring are taken from the BSP).
# ---------------------------------------------------------------------------
display:
  - platform: ili9xxx
    model: S3BOX
    id: my_display
    spi_id: lcd_spi
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO48
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false
    invert_colors: false
    transform:
      mirror_x: true
      mirror_y: true

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  setup_priority: 230
  buffer_size: 16%
  displays: my_display
  rotation: 0
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

script:
  - id: apply_screen_rotation
    then:
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 90
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 180
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 270
                      else:
                        - lvgl.display.set_rotation: 0

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "0"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: refresh_button_grid
