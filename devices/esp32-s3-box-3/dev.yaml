# =============================================================================
# DEV CONFIG - Local development entry point (Espressif ESP32-S3-BOX-3)
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  name: "esp32-s3-box-3-dev"
  friendly_name: "ESP32-S3-BOX-3 Dev"
  espcontrol_component_url: "../.."
  espcontrol_component_ref: "HEAD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/esp32-s3-box-3/www.js"

packages:
  espcontrol: !include packages.yaml
